[project]
name = "bufferlab-deploy"
version = "1.0.0"
description = "BufferLab - Deployment & Kit Readiness: Analytics for GPU buffer strategy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BufferLab Team"}
]

dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "duckdb>=0.9.0",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
pdf = [
    "weasyprint>=60.0",
]

[project.scripts]
bufferlab-deploy = "bufferlab_deploy.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
